<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>memi</title>
    <link rel="icon" href="/img/memi-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/img/memi-180.png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/controls.css" />
    <link rel="stylesheet" href="/css/memories.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/dialogs.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation and filters">
        <div class="sidebar-head">
          <a class="brand" href="#/"><img src="/img/memi-64.png" alt="" width="24" height="24" />memi</a>
          <button class="btn btn-icon sidebar-close" id="drawer-close" type="button" title="Close menu" aria-label="Close menu">
            <span data-icon="x"></span>
          </button>
        </div>
        <div class="sidebar-body">
          <nav aria-label="Pages">
            <ul class="nav pages">
              <li>
                <a class="nav-item" href="#/" data-route="dashboard" data-key="route-dashboard">
                  <span data-icon="layout-dashboard"></span>
                  <span class="label">Dashboard</span>
                </a>
              </li>
              <li>
                <a class="nav-item" href="#/memories" data-route="memories" data-key="route-memories">
                  <span data-icon="rows-3"></span>
                  <span class="label">Memories</span>
                  <span class="count" id="nav-total"></span>
                </a>
              </li>
            </ul>
          </nav>
          <div id="filters"></div>
        </div>
        <div class="sidebar-foot" id="embedder"></div>
      </aside>
      <button class="backdrop" id="backdrop" type="button" tabindex="-1" aria-label="Close menu"></button>

      <main class="main">
        <header class="topbar">
          <button class="btn btn-icon filters-toggle" id="drawer-open" type="button" aria-controls="sidebar" aria-expanded="false" title="Menu" aria-label="Menu">
            <span data-icon="menu"></span>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
          <span class="spacer"></span>
          <div class="search" id="search-box" hidden>
            <span data-icon="search"></span>
            <input class="input" id="search" type="search" placeholder="Search memories" aria-label="Search memories" autocomplete="off" spellcheck="false" />
            <button class="btn btn-icon clear" id="search-clear" type="button" title="Clear search" aria-label="Clear search" hidden>
              <span data-icon="x"></span>
            </button>
          </div>
          <button class="btn btn-primary" id="new" type="button" title="New memory (n)">
            <span data-icon="plus"></span>
            New
          </button>
        </header>

        <div class="banners" id="banners"></div>

        <section class="view" id="view-dashboard" aria-labelledby="page-title">
          <div class="scroller dash" id="dash"></div>
        </section>

        <section class="view" id="view-memories" aria-labelledby="page-title" hidden>
          <div class="statusline">
            <div class="left" id="summary" aria-live="polite"></div>
            <div class="right">
              <div class="segmented" id="mode" role="group" aria-label="Search mode" hidden></div>
              <select class="select" id="range" aria-label="Updated within">
                <option value="all">All time</option>
                <option value="24h">Last 24 hours</option>
                <option value="7d">Last 7 days</option>
                <option value="30d">Last 30 days</option>
                <option value="90d">Last 90 days</option>
              </select>
              <select class="select" id="order" aria-label="Sort order">
                <option value="recent">Recent</option>
                <option value="oldest">Oldest</option>
                <option value="importance">Importance</option>
              </select>
            </div>
          </div>

          <div class="scroller" id="scroller">
            <table class="table" aria-label="Memories">
              <thead>
                <tr>
                  <th scope="col" class="c-time">Time</th>
                  <th scope="col" class="c-agent">Agent</th>
                  <th scope="col" class="c-memory">Memory</th>
                  <th scope="col" class="c-project">Project</th>
                  <th scope="col" class="c-category">Category</th>
                  <th scope="col" class="c-importance">Importance</th>
                  <th scope="col" class="c-actions"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
            </table>
            <div id="empty"></div>
            <div class="list-foot" id="more"></div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="sheet" id="editor" aria-labelledby="editor-title"></dialog>
    <dialog class="modal" id="confirm" aria-labelledby="confirm-title"></dialog>
    <div id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
